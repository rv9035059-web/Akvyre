<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Akvyre Legal LLP — Social Media Brand Kit & Templates</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --ink:        #0A0A0B;
    --ink-soft:   #121110;
    --bone:       #EAE5DC;
    --bone-dim:   #A19C93;
    --amber:      #D4AF37;
    --amber-bright:#E6C25B;
    --amber-deep: #9A7B1E;
    --muted:      #6E6A63;
    --hairline:   rgba(212,175,55,0.2);
    --hairline-ft: rgba(212,175,55,0.08);
    --card-bg:    rgba(18,17,16,0.7);
    --border-radius: 4px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d0c0b;
    color: var(--bone);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }

  #root {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  /* --- Dashboard Layout --- */
  .sidebar {
    width: 320px;
    background: #080809;
    border-right: 1px solid var(--hairline-ft);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 24px;
    border-bottom: 1px solid var(--hairline-ft);
  }

  .sidebar-logo {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 24px;
    color: var(--bone);
    margin-bottom: 4px;
  }
  .sidebar-logo span { color: var(--amber); }

  .sidebar-tag {
    font-family: 'Geist Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--amber-deep);
  }

  .nav-list {
    list-style: none;
    margin: 0; padding: 16px 8px;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .nav-group-title {
    font-family: 'Geist Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 16px 6px;
  }

  .nav-item {
    padding: 10px 16px;
    font-size: 13.5px;
    border-radius: var(--border-radius);
    cursor: pointer;
    color: var(--bone-dim);
    transition: background 0.2s, color 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-item:hover {
    background: rgba(234, 229, 220, 0.03);
    color: var(--bone);
  }

  .nav-item.active {
    background: rgba(212, 175, 55, 0.08);
    border-left: 3px solid var(--amber);
    color: var(--bone);
    font-weight: 500;
  }

  .nav-item-badge {
    font-family: 'Geist Mono', monospace;
    font-size: 8px;
    background: rgba(255, 255, 255, 0.05);
    padding: 2px 6px;
    border-radius: 2px;
    color: var(--muted);
  }

  /* --- Main Canvas Stage --- */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #0f0e0d;
    overflow: hidden;
  }

  .stage-bar {
    height: 64px;
    border-bottom: 1px solid var(--hairline-ft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: #0a0a0b;
  }

  .stage-title {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 20px;
    color: var(--bone);
  }
  .stage-title span {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    font-style: normal;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.15em;
    margin-left: 12px;
  }

  .zoom-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn {
    background: rgba(234, 229, 220, 0.05);
    border: 1px solid rgba(234, 229, 220, 0.1);
    color: var(--bone);
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:hover {
    background: var(--amber);
    color: var(--ink);
    border-color: var(--amber);
  }

  .btn.active {
    background: var(--amber);
    color: var(--ink);
    border-color: var(--amber);
    font-weight: 500;
  }

  .canvas-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    overflow: auto;
    background: radial-gradient(circle at center, #151413 0%, #0c0b0a 100%);
  }

  .canvas-stage {
    transform-origin: center center;
    transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 40px 100px rgba(0,0,0,0.6);
    border: 1px dashed rgba(212, 175, 55, 0.15);
    background: #000;
  }

  /* --- Control & Spec Panel --- */
  .panel {
    width: 360px;
    background: #080809;
    border-left: 1px solid var(--hairline-ft);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }

  .panel-section {
    padding: 24px;
    border-bottom: 1px solid var(--hairline-ft);
  }

  .panel-h {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--amber);
    margin-top: 0;
    margin-bottom: 16px;
  }

  .panel-p {
    font-size: 13px;
    line-height: 1.6;
    color: var(--bone-dim);
    margin-top: 0;
    margin-bottom: 16px;
  }

  /* --- Editable Controls --- */
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 18px;
  }

  .control-label {
    font-size: 11px;
    font-family: 'Geist Mono', monospace;
    color: var(--bone-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .input-text {
    width: 100%;
    background: #11100f;
    border: 1px solid rgba(234, 229, 220, 0.12);
    border-radius: var(--border-radius);
    padding: 10px 12px;
    color: var(--bone);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-text:focus {
    border-color: var(--amber);
  }

  .textarea-text {
    width: 100%;
    background: #11100f;
    border: 1px solid rgba(234, 229, 220, 0.12);
    border-radius: var(--border-radius);
    padding: 10px 12px;
    color: var(--bone);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    min-height: 80px;
    resize: vertical;
    transition: border-color 0.2s;
  }

  .textarea-text:focus {
    border-color: var(--amber);
  }

  .spec-item {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .spec-item span:first-child { color: var(--muted); }
  .spec-item span:last-child { color: var(--bone); font-family: 'Geist Mono', monospace; }

  /* --- Swatch layout --- */
  .color-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .color-card {
    background: #121110;
    border: 0.5px solid var(--hairline-ft);
    border-radius: 4px;
    overflow: hidden;
  }
  .color-swatch {
    height: 60px;
    width: 100%;
  }
  .color-meta {
    padding: 10px;
    font-family: 'Geist Mono', monospace;
    font-size: 9.5px;
  }
  .color-name {
    color: var(--bone);
    margin-bottom: 2px;
  }
  .color-hex {
    color: var(--amber);
  }

  /* --- List Styling --- */
  .list-bullet {
    list-style: none;
    padding-left: 0;
    margin: 0;
  }
  .list-bullet li {
    font-size: 13px;
    line-height: 1.6;
    color: var(--bone-dim);
    margin-bottom: 8px;
    padding-left: 16px;
    position: relative;
  }
  .list-bullet li::before {
    content: "✦";
    color: var(--amber);
    position: absolute;
    left: 0;
  }
</style>
</head>
<body>

<div id="root"></div>

<!-- React Dependencies -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">

// ── BRAND TOKENS ─────────────────────────────────────────────────────
const AK = {
  ink:        "#0A0A0B",
  bone:       "#EAE5DC",
  boneDim:    "rgba(234,229,220,0.62)",
  amber:      "#D4AF37",
  amberDeep:  "#9A7B1E",
  muted:      "#6E6A63",
  hairlineFt: "rgba(212,175,55,0.18)",
  serif:      "'Cormorant Garamond', Georgia, 'Times New Roman', serif",
  sans:       "'Inter', -apple-system, BlinkMacSystemFont, sans-serif",
  mono:       "'Geist Mono', 'SFMono-Regular', Consolas, monospace",
};

// ── COMMON BRAND PRIMITIVES ───────────────────────────────────────────
function Wordmark({ size = 48, color = AK.bone, dotColor = AK.amber }) {
  return (
    <div style={{
      fontFamily: AK.serif,
      fontStyle: "italic",
      fontWeight: 500,
      fontSize: `${size}px`,
      letterSpacing: "0.005em",
      color,
      lineHeight: 0.96,
      whiteSpace: "nowrap",
    }}>
      A<span style={{ fontStyle: "normal", fontWeight: 400 }}>k</span>v<span style={{ fontStyle: "normal", fontWeight: 400 }}>y</span>re<span style={{ color: dotColor }}>.</span>
    </div>
  );
}

function Hairline({ width = 140, color = AK.amber }) {
  return (
    <div style={{
      width: `${width}px`,
      height: "1px",
      backgroundColor: color,
    }} />
  );
}

function MonoLabel({ children, size = 11, tracking = 0.22, color = AK.amber }) {
  return (
    <span style={{
      fontFamily: AK.mono,
      fontSize: `${size}px`,
      letterSpacing: `${tracking}em`,
      color,
      textTransform: "uppercase",
      lineHeight: 1.2,
    }}>
      {children}
    </span>
  );
}

function AvatarMark({ size = 400, circle = false }) {
  const ruleY    = size * 0.54;
  const ruleHalf = size * 0.20;
  const dotY     = size * 0.43;
  const dotR     = size * 0.022;
  const stroke   = Math.max(1.6, size * 0.0075);

  return (
    <div style={{
      width: `${size}px`, height: `${size}px`,
      background: AK.ink,
      borderRadius: circle ? "50%" : 0,
      overflow: "hidden",
      position: "relative",
    }}>
      <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}
           style={{ display: "block" }} xmlns="http://www.w3.org/2000/svg">
        <line
          x1={size / 2 - ruleHalf} y1={ruleY}
          x2={size / 2 + ruleHalf} y2={ruleY}
          stroke={AK.amber} strokeWidth={stroke} strokeLinecap="butt"
        />
        <circle cx={size / 2} cy={dotY} r={dotR} fill={AK.amber} />
      </svg>
    </div>
  );
}

// ── LINKEDIN TEMPLATES ───────────────────────────────────────────────
function LinkedInPost({ category, date, issue, headline, subhead }) {
  return (
    <div style={{
      width: 1080, height: 1080, background: AK.ink, color: AK.bone,
      padding: 80, boxSizing: "border-box", position: "relative",
      display: "flex", flexDirection: "column", justifyContent: "space-between",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <span style={{ width: 8, height: 8, background: AK.amber, borderRadius: "50%" }} />
          <MonoLabel size={14} color={AK.amber}>{category}</MonoLabel>
        </div>
        <MonoLabel size={14} color={AK.muted}>{date}</MonoLabel>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 32, maxWidth: 880 }}>
        <MonoLabel size={11} color={AK.amberDeep} tracking={0.32}>RESEARCH &amp; INSIGHTS · {issue}</MonoLabel>
        <h1 style={{
          margin: 0, fontFamily: AK.serif, fontWeight: 400,
          fontSize: 84, lineHeight: 1.06, letterSpacing: "-0.012em",
          color: AK.bone,
        }}>
          {headline}
        </h1>
        <p style={{
          margin: 0, fontFamily: AK.serif, fontStyle: "italic", fontWeight: 400,
          fontSize: 30, lineHeight: 1.35, color: AK.boneDim,
          maxWidth: 820,
        }}>
          {subhead}
        </p>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <Wordmark size={26} />
          <Hairline width={100} />
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <MonoLabel size={12} color={AK.bone}>READ AT AKVYRE.COM</MonoLabel>
          <span style={{ fontFamily: AK.serif, fontSize: 22, color: AK.amber }}>→</span>
        </div>
      </div>
    </div>
  );
}

function LinkedInThoughtLeadership({ tag, date, quote, author, role, avatarUrl }) {
  return (
    <div style={{
      width: 1080, height: 1350, background: AK.ink, color: AK.bone,
      padding: "96px 88px", boxSizing: "border-box",
      display: "flex", flexDirection: "column", justifyContent: "space-between",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <span style={{ width: 8, height: 8, background: AK.amber, borderRadius: "50%" }} />
          <MonoLabel size={14} color={AK.amber}>{tag}</MonoLabel>
        </div>
        <MonoLabel size={14} color={AK.muted}>{date}</MonoLabel>
      </div>

      <div style={{ display: "flex", gap: 32, alignItems: "stretch", margin: "80px 0" }}>
        <div style={{ width: 4, background: `linear-gradient(180deg, ${AK.amber} 0%, rgba(212,175,55,0) 100%)` }} />
        <div style={{ display: "flex", flexDirection: "column", gap: 32 }}>
          <span style={{
            fontFamily: AK.serif, fontWeight: 400, fontStyle: "italic",
            fontSize: 160, lineHeight: 0.2, color: AK.amber, height: 48, display: "block"
          }}>“</span>
          <p style={{
            margin: 0, fontFamily: AK.serif, fontStyle: "italic", fontWeight: 400,
            fontSize: 54, lineHeight: 1.35, letterSpacing: "-0.005em", color: AK.bone,
          }}>
            {quote}
          </p>
        </div>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", borderTop: `1px solid ${AK.hairlineFt}`, paddingTop: 40 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
          <div style={{ width: 80, height: 80, borderRadius: "50%", border: `1.5px solid ${AK.amber}`, overflow: "hidden", background: "#222" }}>
            {avatarUrl ? (
              <img src={avatarUrl} style={{ width: "100%", height: "100%", objectFit: "cover" }} alt={author} />
            ) : (
              <div style={{ width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: AK.serif, color: AK.amber, fontSize: 32 }}>A</div>
            )}
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <span style={{ fontFamily: AK.serif, fontWeight: 500, fontSize: 28, color: AK.bone }}>{author}</span>
            <span style={{ fontFamily: AK.sans, fontSize: 15, color: AK.boneDim }}>{role}</span>
          </div>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 12, alignItems: "flex-end" }}>
          <Wordmark size={24} />
          <Hairline width={80} />
        </div>
      </div>
    </div>
  );
}

function LinkedInLegalUpdate({ category, date, act, section, impactHeadline, points }) {
  const pointsArr = points.split("\n").filter(Boolean);
  return (
    <div style={{
      width: 1080, height: 1080, background: AK.ink, color: AK.bone,
      padding: 80, boxSizing: "border-box",
      display: "flex", flexDirection: "column", justifyContent: "space-between",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <span style={{ width: 8, height: 8, background: AK.amber, borderRadius: "50%" }} />
          <MonoLabel size={14} color={AK.amber}>{category}</MonoLabel>
        </div>
        <MonoLabel size={14} color={AK.muted}>{date}</MonoLabel>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1.2fr", gap: 48, margin: "40px 0" }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 20, justifyContent: "center" }}>
          <MonoLabel size={11} color={AK.amberDeep} tracking={0.3}>STATUTORY NOTIFICATION</MonoLabel>
          <h2 style={{ fontFamily: AK.serif, fontWeight: 500, fontSize: 52, color: AK.bone, margin: 0, lineHeight: 1.1 }}>{act}</h2>
          <div style={{ width: 60, height: 1, background: AK.amber }} />
          <div style={{ fontFamily: AK.mono, fontSize: 16, color: AK.amber, letterSpacing: "0.05em" }}>{section}</div>
        </div>

        <div style={{
          background: "linear-gradient(180deg, rgba(30,27,22,0.66) 0%, rgba(20,18,14,0.5) 100%)",
          border: `1px solid ${AK.hairlineFt}`, borderRadius: 6, padding: "36px 40px",
          display: "flex", flexDirection: "column", gap: 24,
          boxShadow: "0 20px 50px rgba(0,0,0,0.3)"
        }}>
          <MonoLabel size={10} color={AK.amber} tracking={0.22}>IMPACT FOR BOARDS &amp; FOUNDERS</MonoLabel>
          <div style={{ fontFamily: AK.serif, fontWeight: 500, fontSize: 26, color: AK.bone, lineHeight: 1.2 }}>{impactHeadline}</div>
          <ul style={{ margin: 0, paddingLeft: 20, display: "flex", flexDirection: "column", gap: 14, color: AK.boneDim, fontSize: 14, lineHeight: 1.5 }}>
            {pointsArr.map((pt, i) => <li key={i} style={{ marginBottom: 4 }}>{pt}</li>)}
          </ul>
        </div>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <Wordmark size={26} />
          <Hairline width={100} />
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <MonoLabel size={12} color={AK.bone}>READ FULL BRIEFING AT AKVYRE.COM</MonoLabel>
          <span style={{ fontFamily: AK.serif, fontSize: 22, color: AK.amber }}>→</span>
        </div>
      </div>
    </div>
  );
}

// ── INSTAGRAM TEMPLATES ──────────────────────────────────────────────
function InstagramCarouselCover({ tag, issue, title, subtitle, slideIndex, slideTotal }) {
  return (
    <div style={{
      width: 1080, height: 1080, background: AK.ink, color: AK.bone,
      padding: 88, boxSizing: "border-box", position: "relative",
      display: "flex", flexDirection: "column", justifyContent: "space-between",
    }}>
      <div style={{
        position: "absolute", top: "-10%", right: "-10%", width: 600, height: 600,
        borderRadius: "50%", background: "radial-gradient(circle, rgba(212,175,55,0.06) 0%, rgba(212,175,55,0) 70%)"
      }} />

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", zIndex: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ width: 6, height: 6, background: AK.amber, borderRadius: "50%" }} />
          <MonoLabel size={13} color={AK.amber}>{tag}</MonoLabel>
        </div>
        <MonoLabel size={13} color={AK.muted}>{issue}</MonoLabel>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 32, zIndex: 10, maxWidth: 840 }}>
        <h1 style={{
          margin: 0, fontFamily: AK.serif, fontWeight: 400,
          fontSize: 82, lineHeight: 1.08, letterSpacing: "-0.015em", color: AK.bone,
          whiteSpace: "pre-line"
        }}>
          {title}
        </h1>
        <p style={{
          margin: 0, fontFamily: AK.serif, fontStyle: "italic", fontWeight: 400,
          fontSize: 28, lineHeight: 1.45, color: AK.boneDim, maxWidth: 720
        }}>
          {subtitle}
        </p>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", zIndex: 10 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <Wordmark size={24} />
          <Hairline width={80} />
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 24 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <MonoLabel size={12} color={AK.bone}>SWIPE RIGHT</MonoLabel>
            <span style={{ fontFamily: AK.serif, fontSize: 20, color: AK.amber }}>→</span>
          </div>
          <div style={{ fontFamily: AK.mono, fontSize: 13, color: AK.amber, letterSpacing: "0.1em" }}>
            {slideIndex} <span style={{ color: AK.muted }}>/</span> {slideTotal}
          </div>
        </div>
      </div>
    </div>
  );
}

function InstagramCarouselContent({ tag, stepNumber, stepTitle, stepDescription, takeaway, slideIndex, slideTotal }) {

            <div className="spec-item">

}
